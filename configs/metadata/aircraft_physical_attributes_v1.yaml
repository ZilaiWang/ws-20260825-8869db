contract_version: aircraft_physical_attributes_v1
scope: class_level_semantic_metadata_only
image_or_checkpoint_reuse: false
intended_use: training_only_auxiliary_supervision
provenance:
  - ExpertDet / PSP.Plane attribute design (public paper and benchmark metadata)
  - SLIP-RS structured aircraft attribute dictionary (official public repository)
  - aircraft model specifications checked as class-level public facts
exclusions:
  - absolute size, because normalized proposal crops remove metric scale
  - manufacturer or country, because they are not directly visible physical cues
  - engine position and canard, because model-variant ambiguity is too high
  - external PSP/MAR20 bridge images or pretrained weights

