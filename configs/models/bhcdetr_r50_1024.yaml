# Canonical BHC-DETR baseline config. For the opt-in UHR-derived small-object
# path use bhcdetr_uhr_r50_1024.yaml; this file intentionally remains unchanged.
experiment_id: "BHCDETR-R50-1024-devv2-seed42"
model: "bhcdetr"
seed: 42
output_dir: "outputs/BHCDETR-R50-1024-devv2-seed42"
resume: null
data:
  root: "../data"
  manifest: "data/splits/dev_v2_airport_proxy_k60.json"
  held_out_fold: null
architecture:
  num_classes: 25
  image_size: 1024
  backbone: "resnet50"
  backbone_pretrained: true
  backbone_weights: null
  train_backbone: true
  hidden_dim: 256
  num_queries: 300
  encoder_layers: 6
  decoder_layers: 6
  nheads: 8
  dim_feedforward: 1024
  dropout: 0.1
  projection_dim: 128
  prior_probability: 0.01
loss:
  match_class_cost: 2.0
  match_bbox_cost: 5.0
  match_giou_cost: 2.0
  class_loss_weight: 2.0
  bbox_loss_weight: 5.0
  giou_loss_weight: 2.0
  bhcl_weight: 0.6
  auxiliary_loss_weight: 1.0
  focal_alpha: 0.25
  focal_gamma: 2.0
  temperature: 0.1
  prototype_momentum: 0.1
train:
  device: "cuda:0"
  epochs: 120
  batch_size: 4
  views_per_image: 2
  gradient_accumulation_steps: 1
  workers: 4
  learning_rate: 0.00005
  weight_decay: 0.0001
  scheduler: "none"
  amp: true
  deterministic: true
  clip_max_norm: 0.1
  augmentation:
    flip_probability: 0.5
    max_shift_ratio: 0.1
