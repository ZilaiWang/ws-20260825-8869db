project:
  name_cn: "基于不均衡小样本学习的遥感陆上小目标检测系统"
  package_name: "rsdet"

# 协作接口与官方评估实现的独立版本；变更规则见 docs/EXPERIMENT_PROTOCOL.md。
protocol_versions:
  contract_version: "contract_v1"
  eval_version: "official_eval_v1"
  # V1.6 只改变排名聚合与二次排序，不改变细类匹配轨迹。
  ranking_version: "official_ranking_v1_6"
  # 2026-08-31 正式平台已观测确认：三粗类各自 fine-macro 后等权硬门，
  # 六个质量子分与一个时延子分等权。历史 pooled/v1.6 只作诊断。
  metric_protocol: "platform_observed_20260831"

task:
  class_names:
    - ship
    - aircraft
    - vehicle
  # 匹配时必须保留 25 个细类；本映射只用于选择 IoU 阈值和汇总三大类指标。
  dataset_category_mapping:
    0: ship
    1: ship
    2: ship
    3: ship
    4: aircraft
    5: aircraft
    6: aircraft
    7: aircraft
    8: aircraft
    9: aircraft
    10: aircraft
    11: aircraft
    12: aircraft
    13: aircraft
    14: aircraft
    15: aircraft
    16: aircraft
    17: aircraft
    18: aircraft
    19: aircraft
    20: aircraft
    21: aircraft
    22: aircraft
    23: aircraft
    24: vehicle

official_evaluation:
  recall_min: 0.85
  fdr_max: 0.20
  latency_max_seconds: 20.0
  benchmark_image_width: 10000
  benchmark_image_height: 10000
  reference_device: "NVIDIA RTX 3090"

  iou_thresholds:
    ship: 0.50
    aircraft: 0.50
    vehicle: 0.35

  matching:
    sort_predictions_by_score_descending: true
    one_prediction_per_ground_truth: true
    duplicate_predictions_count_as_fp: true

  # 粗类页面指标 = 大类内细类简单平均；正式硬门 = ship/aircraft/vehicle
  # 三个页面指标的算术平均。RankingMetrics.overall_*（25 细类等权）和 pooled
  # TP/FP/FN 都仅作诊断，禁止用于正式选择。
  ranking:
    fine_macro_average: true
    fine_average_policy: configured_taxonomy
    require_complete_taxonomy_for_formal: true

runtime_scope:
  exclude_image_disk_read: true
  include_preprocess_after_read: true
  include_tiling: true
  include_model_inference: true
  include_postprocess: true
  include_coordinate_restore: true
  include_result_serialization: true
