  training_manifest_sha256: bf1bc8fe3db193dfaac6900ec35f0c1c9df16be25ed782535e13490de148e5a4
  inference_manifest: outputs/R1-0-P03-TEACHER-M1-OOF/prepare/proposal_inference_manifest.csv
  inference_manifest_sha256: 48747c3bba75ec5226e52fff5b488bb92eaa17d9722e377ec393a9cadeafdab0
  base_logits_sha256:
    "0": 45701eb30a2bf7ee0e14aa21ef6f998422f45fc1f7126ca227d4d3e9d3b8cd00
    "1": 72c803e7db8728ea192788c27d49fdda385005860c516216f5970ef807c948a5
    "2": 5953b1c7660f06d3e68e789fc98b033ad09c8cc0fe35b930d7f92ff0e284e7f7
  formal_crop_manifest: outputs/P0-2-FORMAL-CROP-LOCALCHECK/formal_crop_manifest.csv
  formal_crop_manifest_sha256: a3bed44fa6166fa7ee67555ea81ba96024652c0bba81a67da056c78d3e484128
  y1_calibration_result: outputs/Y1-CROSSFIT-CALIBRATION-V1/calibration_result.json
  y1_calibration_result_sha256: 8b9e7a8618b77d167a40bdc2eaf01a9463e9cf8489fdfca7aed1b0059b7b3c12
  convnext_weight_sha256: 983f1562536e84ff750a1576fb08e54de751dbf2e17c0d8a4a13704341fdcd3d
  p03_checkpoint_sha256:
    "0": 243d96481f4c6b8c0048c72484b5f395cd2f0c5ba55d103c9b6b665ac4981f54
    "1": bd56974d6598d4f104f11d75fa38b5771e2c20acd55858d1becc26c7a66a7fb7
    "2": eb0a13b3f97c42098ff5ba4bcef5deefcf8f0f5604b346e2c9289fa4246a1c10
  expected_images: 4481
  expected_annotations: 20933
  expected_counts:
    training_aircraft_rows: 17948
    inference_aircraft_rows: 32062

attribute_taxonomy:
  path: configs/metadata/aircraft_physical_attributes_v1.yaml
  sha256: aacb65cbd9a781dcdabee7cc427935ec7c7ffed7704f6ee5ab5bc52d0f2f5929

training:
  methods: [structured_attribute]
  primary_method: structured_attribute
  initialization: fold_specific_P03_fixed_epoch30
  epochs: 5
  checkpoint_selection: fixed_epoch_last_no_heldout_evaluation
  seed: 42
  backbone_lr: 2.0e-5
  head_lr: 1.0e-4
  weight_decay: 0.05
  label_smoothing: 0.05
  grad_clip_norm: 1.0
  kd_temperature: 2.0
  kd_weight: 0.0
  kd_selection: disabled
  structured_attribute:
    loss_weight: 0.10
    label_smoothing: 0.02
    aggregation: equal_dimension_mean
    schedule: linear_epoch_ramp
    auxiliary_heads_serialized: false
  augmentation: uniform_random_D4
  sampling: natural

runtime:
  torch_version: 2.5.1
  torchvision_version: 0.20.1
  cuda_runtime: "12.1"
  train_batch_size: 96
  inference_object_batch_size: 16
  num_workers: 8
  amp: fp16

search:
  min_top_probabilities: [0.55, 0.70, 0.85]
  min_margins: [0.10, 0.25]
  fusion_alphas: [0.10, 0.25]
  gated_fusion_alpha: 0.20
  threshold_start: 0.001
  threshold_stop: 0.301
  threshold_step: 0.01
  maximum_selection_recall_drop: 0.003
  probability_semantics: p_fine_class_given_detector_aircraft_route

conditions:
  reference: ce_identity
  primary: structured_attribute_identity
  evaluate:
    - ce_identity
    - structured_attribute_identity
    - structured_attribute_d4

decision_gates:
  official_recall_min: 0.85
  official_fdr_max: 0.20
  aircraft_macro_recall_tolerance: 0.002
  aircraft_macro_fdr_tolerance: 0.002
  require_nonnegative_net_tp: true
  require_exact_ship_vehicle_parity: true

scientific_scope:
  level: iterative_oof_development
  formal_admission_before_run: false
  primary_hypothesis: >-
    Five class-level physical attributes provide shared, overhead-visible
    supervision that improves proposal-crop fine-class generalization beyond
    plain CE without changing deployed architecture or ship/vehicle outputs.
  adaptation_from:
    - ExpertDet VMAM physical-attribute supervision
    - SLIP-RS structured-attribute decoupling
  exclusions:
    - no external PSP/MAR20 bridge images
    - no external pretrained weights or pseudo-labels
    - no language encoder or attribute module at inference
    - no absolute-size or manufacturer shortcut
    - no background rejector, bbox refinement, or detector retraining
