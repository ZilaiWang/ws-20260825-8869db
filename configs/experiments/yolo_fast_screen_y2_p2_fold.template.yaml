screening_contract: "yolo_fast_screen_v1"
candidate_key: "Y2S"
seed: 42
output_dir: "__FOLD_OUTPUT_DIR__"
model:
  family: "yolo"
  architecture: "yolo26s-p2.yaml"
  weights: "__OFFICIAL_YOLO26S_PRETRAINED_PATH__"
data:
  root: "__DATA_ROOT__"
  manifest: "__FOLD_SPLIT_VIEW__"
train:
  device: "cuda:0"
  checkpoint_selection: "last"
  epochs: 40
  args:
    imgsz: 1024
    batch: 12
    workers: 8
    optimizer: "AdamW"
    lr0: 0.002
    lrf: 0.01
    weight_decay: 0.0005
    warmup_epochs: 3
    cos_lr: true
    amp: true
    deterministic: true
    patience: 0
    val: false
    plots: false
    close_mosaic: 5
