teacher:
  architecture: torchvision_convnext_tiny
  source_experiment: P03-FORMAL-CV3-V2-CONVNEXT-T224
  input_policy: tight_detector_proposal
  resolution: 224
  fold_specific: true
  num_classes: 25
  cross_coarse_relabel_allowed: false

runtime:
  torch_version: 2.5.1
  torchvision_version: 0.20.1
  cuda_runtime: "12.1"
  batch_size: 128
  num_workers: 8
  amp: fp16

search:
  min_top_probabilities: [0.75, 0.90]
  min_margins: [0.15, 0.35]
  fusion_alphas: [0.20, 0.40]
  gated_fusion_alpha: 0.30
  threshold_start: 0.001
  threshold_stop: 0.301
  threshold_step: 0.01
  maximum_selection_recall_drop: 0.005
  selection_policy: >-
    Eligible only when selection Recall drops at most 0.005, FDR does not
    increase, and the official gate passes; then maximize macro Recall, minimize
    macro FDR, maximize pooled Recall, minimize pooled FDR. Exact ties prefer D0.

decision_gates:
  official_recall_min: 0.85
  official_fdr_max: 0.20
  maximum_recall_drop: 0.005
  maximum_fdr_increase: 0.0
  minimum_incremental_macro_recall: 0.002
  require_new_tp_not_less_than_broken_tp: true

scientific_scope:
  status_before_run: preregistered
  formal_admission_before_run: false
  claims:
    - inference-only domain-transfer screen of a GT-crop teacher
    - fold-specific checkpoints and outer two-fold method selection
    - frozen Y1 C2 parameters used only for incremental operational comparison
  exclusions:
    - no proposal-domain fine-tuning
    - no background class
    - no bbox change
    - no cross-coarse relabel
    - no latency or 10K deployment claim
