# Y3 is admitted only by a positive Y2 decision supplied to the runtime.
experiment_id: "Y3-yolo26-p2-ibs-pair-1024-cv3-fold__FOLD__-seed42"
seed: 42
output_dir: "__FOLD_OUTPUT_DIR__"
model:
  family: "yolo"
  architecture: "yolo26s-p2.yaml"
  quality_module: "ibs_p2_pair_v1"
  weights: "__OFFICIAL_YOLO26S_PRETRAINED_PATH__"
data:
  root: "__DATA_ROOT__"
  manifest: "__FOLD_SPLIT_VIEW__"
train:
  device: "cuda:0"
  checkpoint_selection: "last"
  args:
    imgsz: 1024
    batch: 12
    workers: 8
    optimizer: "AdamW"
    lr0: 0.002
    lrf: 0.01
    weight_decay: 0.0005
    warmup_epochs: 3
    cos_lr: true
    amp: true
    deterministic: true
    patience: 0
    val: false
    plots: false
  stages:
    - name: "foundation"
      epochs: 160
      balanced: false
      args:
        close_mosaic: 20
