contract_version: n2_cfg_background_gate_v1
experiment_id: N2-CFG-BACKGROUND-GATE-V1
project_config: configs/project.yaml

# N2-CFG：Audited Coarse-conditioned Foreground Gate（粗类条件式前景门控）。
# 只做 background_reject；舰船/车辆正式门控，飞机 shadow 旁路。
# 详细合同见《改进方案 1》第 2、3、5 节。

inputs:
  selected_predictions: outputs/R1-6-POST-RERANK-NMS/selected_predictions_xyxy.json
  selected_predictions_sha256: d07f43e5a1b610d44cdedbedd844719e003aa6e978380fb2257093648975d047
  formal_crop_manifest: outputs/P0-2-FORMAL-CROP-LOCALCHECK/formal_crop_manifest.csv
  formal_crop_manifest_sha256: a3bed44fa6166fa7ee67555ea81ba96024652c0bba81a67da056c78d3e484128
  image_ledger: outputs/M1-CV3-OOF-return-no-checkpoints-extracted-20260725/M1-CV3-OOF-aggregate/oof_images.csv
  image_ledger_sha256: fc2aa7ca947f71d841700b656ece5e90f3112746e0c3f592a78a231d958a750c
  # N0 盲审编译产物，B 回传 manual_review_decisions.csv 后由 compile_fp_bg_review.py 生成。
  clear_background_whitelist: outputs/N0-FP-BG-AUDIT-R1-6-V3/compiled/clear_background_whitelist.csv
  convnext_weights: weights/convnext_tiny_imagenet1k_v1.pth
  expected_images: 4481
  expected_annotations: 20933

# 冻结的输入尺度与扩展（不得在 outer-val 前改动）。
crop:
  policy: context_1p25
  expansion_ratio: 1.25
  resolution: 224

# 冻结的训练策略。
training:
  epochs: 5
  batch_size: 64
  batches_per_epoch: 200
  learning_rate: 0.001
  seed: 202625
  freeze: freeze_backbone            # Level-E 快筛；正式用 freeze_first_three_stages
  active_coarse: [ship, vehicle, aircraft]  # 三粗类都训练，aircraft 仅 shadow 评估

# 冻结的采样均衡。
sampling:
  foreground_fraction: 0.5
  background_fraction: 0.5
  coarse_balanced: true
  fine_class_balanced: true
  background_strata: [fold, score_bin, source_group]

# 校准器（只允许 inner_score_calib 学习 alpha/beta/gamma/tau_drop）。
gate:
  active_coarse_first_round: [ship, vehicle]  # aircraft 旁路
  alpha_constraint: ">=0"
  beta_constraint: ">=0"
  single_global_tau_drop: true
  recall_budget_per_fold: 0           # 快筛允许删除的最大 TP 数（车辆/HM/LQS 零损失）

# 快筛门禁（《改进方案 1》3.2）。
admission:
  fp_bg_reduction_pooled: 0.10
  overall_recall_drop_max: 0.002
  coarse_recall_drop_max: 0.005
  min_fold_direction: 0.667           # >=2/3 fold 同向
  s2_must_beat_s0: true
  aircraft_parity: true
