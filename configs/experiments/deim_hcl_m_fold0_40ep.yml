__include__:
  - /root/autodl-tmp/peer-methods/star-xh25-hcl/.third_party/DEIM/configs/deim_dfine/deim_hgnetv2_m_coco.yml

# Research-only paired screen of the public DEIM + decoupled-query + HCL idea.
# The peer extension is pinned by the server driver and is not vendored here.
output_dir: /root/autodl-tmp/results/PEER-DEIM-HCL-M-FOLD0-40EP-V1/training
num_classes: 25
remap_mscoco_category: false
epoches: 40
checkpoint_freq: 10
print_freq: 50
sync_bn: false
find_unused_parameters: false
eval_spatial_size: [1024, 1024]

DEIM:
  decoder: BHCLDFINETransformer

BHCLDFINETransformer:
  feat_channels: [256, 256, 256]
  feat_strides: [8, 16, 32]
  hidden_dim: 256
  num_levels: 3
  num_layers: 4
  eval_idx: -1
  num_queries: 300
  num_denoising: 100
  label_noise_ratio: 0.5
  box_noise_scale: 1.0
  reg_max: 32
  reg_scale: 4
  layer_scale: 1
  num_points: [3, 6, 3]
  cross_attn_method: default
  query_select_method: default
  activation: silu
  mlp_act: silu
  decouple_queries: true
  bhcl_mode: hcl
  bhcl_embedding_dim: 128

criterion: BHCLDEIMCriterion

BHCLDEIMCriterion:
  weight_dict:
    loss_vfl: 1
    loss_mal: 1
    loss_bbox: 5
    loss_giou: 2
    loss_fgl: 0.15
    loss_ddf: 1.5
    loss_bhcl: 0.6
  losses: [mal, boxes, local, bhcl]
  alpha: 0.75
  gamma: 1.5
  reg_max: 32
  matcher:
    type: HungarianMatcher
    weight_dict: {cost_class: 2, cost_bbox: 5, cost_giou: 2}
    alpha: 0.25
    gamma: 2.0
  bhcl_mode: hcl
  bhcl_embedding_dim: 128
  bhcl_temperature: 0.1
  bhcl_epsilon: 0.1

optimizer:
  type: AdamW
  params:
    - params: '^(?=.*backbone)(?!.*bn).*$'
      lr: 0.000005
    - params: '^(?=.*(?:norm|bn)).*$'
      weight_decay: 0.0
  lr: 0.00005
  betas: [0.9, 0.999]
  weight_decay: 0.0001

flat_epoch: 24
no_aug_epoch: 8
warmup_iter: 500

train_dataloader:
  dataset:
    img_folder: /root/autodl-tmp/data
    ann_file: /root/autodl-tmp/results/PEER-DEIM-HCL-M-FOLD0-40EP-V1/coco/instances_train.json
    transforms:
      ops:
        - {type: Mosaic, output_size: 512, rotation_range: 10, translation_range: [0.1, 0.1], scaling_range: [0.5, 1.5], probability: 1.0, fill_value: 0, use_cache: false, max_cached_images: 50, random_pop: true}
        - {type: RandomPhotometricDistort, p: 0.5}
        - {type: RandomZoomOut, fill: 0}
        - {type: RandomIoUCrop, p: 0.8}
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: RandomHorizontalFlip}
        - {type: Resize, size: [1024, 1024]}
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: ConvertPILImage, dtype: float32, scale: true}
        - {type: ConvertBoxes, fmt: cxcywh, normalize: true}
      policy:
        epoch: [4, 24, 32]
        ops: [Mosaic, RandomPhotometricDistort, RandomZoomOut, RandomIoUCrop]
      mosaic_prob: 0.5
  total_batch_size: 4
  num_workers: 8
  collate_fn:
    type: BatchImageCollateFunction
    base_size: 1024
    base_size_repeat: 1
    mixup_prob: 0.5
    mixup_epochs: [4, 24]
    stop_epoch: 40
    ema_restart_decay: 0.9999

val_dataloader:
  dataset:
    img_folder: /root/autodl-tmp/data
    ann_file: /root/autodl-tmp/results/PEER-DEIM-HCL-M-FOLD0-40EP-V1/coco/instances_val.json
    transforms:
      type: Compose
      ops:
        - {type: Resize, size: [1024, 1024]}
        - {type: ConvertPILImage, dtype: float32, scale: true}
  total_batch_size: 8
  num_workers: 8
