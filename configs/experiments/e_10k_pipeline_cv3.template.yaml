# Template only. Formal timing is performed on 10000x10000 images.
model:
  adapter: "ultralytics"
  family: "__MODEL_FAMILY__"
  checkpoint: "__SELECTED_CHECKPOINT__"
  imgsz: 1024
  confidence: 0.001
  iou: 0.70
  max_detections: 500
  half: true
device: "cuda:0"
batch_size: 8
input:
  data_root: "__10K_DATA_ROOT__"
  manifest: "__10K_MANIFEST__"
  split: "test"
tiling:
  enabled: true
  force: true
  tile_size: 1280
  overlap: 256
  fine_nms_iou: 0.55
  coarse_nms_iou: 0.85
  max_detections: 2000
score_thresholds:
  ship: 0.001
  aircraft: 0.001
  vehicle: 0.001
fine_score_thresholds: {}
output_json: "__OUTPUT_DIR__/predictions_10k_low.json"

