checkpoint: ""            # 模型权重路径（必填）
device: "cuda"
mixed_precision: true
tile_size: 1024
tile_overlap: 200
batch_size: 1
score_thresholds:
  ship: 0.3
  aircraft: 0.3
  vehicle: 0.3
max_detections_per_tile: 500
postprocess:
  nms_iou_threshold: 0.5
  apply_calibration: false
output_json: "outputs/predictions.json"
